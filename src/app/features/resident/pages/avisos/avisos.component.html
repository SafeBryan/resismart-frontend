<div class="layout">
  <app-sidebar class="sidebar" [nav]="residentNav" subtitle="Residente"></app-sidebar>

  <main class="content">
    <div class="content-inner">
      <header class="page-head">
        <div>
          <h1>Avisos y comunicados</h1>
          <p class="muted">
            Consulta los últimos avisos importantes del condominio. Filtra por categoría para encontrar lo que necesitas.
          </p>
        </div>
        <div class="head-actions">
          <app-button label="Marcar todo como leído" variant="secondary"></app-button>
        </div>
      </header>

      <section class="filters">
        <button
          type="button"
          *ngFor="let filtro of filtros"
          class="filter-chip"
          [class.active]="filtroSeleccionado === filtro.value"
          (click)="seleccionarFiltro(filtro.value)"
        >
          {{ filtro.label }}
        </button>
      </section>

      <section class="avisos-grid">
        <article class="aviso-card" *ngFor="let aviso of avisosFiltrados">
          <header>
            <div>
              <span class="pill categoria" [ngClass]="categoriaClass(aviso.categoria)">{{ aviso.categoria }}</span>
              <span class="pill estado" [ngClass]="estadoClass(aviso.estado)">{{ aviso.estado }}</span>
            </div>
            <span class="fecha">{{ aviso.fecha }}</span>
          </header>
          <h2>{{ aviso.titulo }}</h2>
          <p class="descripcion">{{ aviso.descripcion }}</p>
          <footer>
            <span class="muted">Responsable: {{ aviso.responsable }}</span>
            <div class="acciones">
              <app-button label="Ver detalle" variant="secondary"></app-button>
              <app-button label="Archivar" variant="secondary"></app-button>
            </div>
          </footer>
        </article>
      </section>
    </div>
  </main>
</div>
