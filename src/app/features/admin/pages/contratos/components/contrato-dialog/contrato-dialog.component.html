<div class="modal" *ngIf="visible">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="contrato-dialog-title" *ngIf="isCreate()">Nuevo Contrato</h3>
      <h3 id="contrato-dialog-title" *ngIf="isEdit()">Editar Contrato</h3>
      <h3 id="contrato-dialog-title" *ngIf="isView()">Detalle de Contrato</h3>

      <button mat-icon-button (click)="cancelar()" aria-label="Cerrar diálogo">
        <mat-icon fontIcon="close"></mat-icon>
      </button>
    </div>

    <form
      [formGroup]="form"
      class="accessible-form"
      (ngSubmit)="guardar()"
      aria-labelledby="contrato-dialog-title"
    >
      <fieldset class="form-section">
        <legend>Datos del contrato</legend>
        <div class="form-grid">
          <mat-form-field appearance="outline">
            <mat-label>Condominio</mat-label>
            <mat-select formControlName="idCondominio" [disabled]="isView()">
              <mat-option *ngFor="let c of condominios()" [value]="c.id">
                {{ c.nombre }}
              </mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Unidad</mat-label>
            <mat-select formControlName="idUnidad" [disabled]="isView()">
              <mat-option *ngFor="let u of unidades()" [value]="u.id">
                {{ u.numero }}
              </mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Residente</mat-label>
            <mat-select formControlName="idResidente" [disabled]="isView()">
              <mat-option *ngFor="let r of residentes()" [value]="r.id_Cliente">
                {{ r.usuario?.nombres }} {{ r.usuario?.apellidos }} (ID {{ r.id_Cliente }})
              </mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Fecha de Inicio (YYYY-MM-DD)</mat-label>
            <input
              matInput
              formControlName="fechaInicio"
              [readonly]="isView()"
              placeholder="2025-11-01"
            />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Fecha de Fin (opcional)</mat-label>
            <input
              matInput
              formControlName="fechaFin"
              [readonly]="isView()"
              placeholder="2026-11-01"
            />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Monto mensual</mat-label>
            <input
              matInput
              type="number"
              step="0.01"
              formControlName="monto"
              [readonly]="isView()"
            />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Estado</mat-label>
            <input matInput formControlName="estado" readonly />
          </mat-form-field>
        </div>
      </fieldset>

      <div class="form-actions">
        <button type="button" mat-stroked-button (click)="cancelar()">Cancelar</button>
        <button
          *ngIf="!isView()"
          type="submit"
          mat-raised-button
          color="primary"
          [disabled]="form.invalid || saving()"
        >
          {{ isCreate() ? 'Crear' : 'Guardar' }}
        </button>
      </div>
    </form>
  </div>
</div>
