<div class="page reset-page">
  <div class="card">
    <h2>Restablecer contrase&ntilde;a</h2>
    <p>Ingresa tu nueva contrase&ntilde;a para continuar.</p>

    <form (submit)="$event.preventDefault(); submit()" class="form">
      <label class="input-label">Nueva contrase&ntilde;a</label>
      <app-input
        placeholder="Tu nueva contrase&ntilde;a"
        icon="lock"
        type="password"
        [(model)]="password"
      ></app-input>

      <label class="input-label">Confirmar contrase&ntilde;a</label>
      <app-input
        placeholder="Repite la contrase&ntilde;a"
        icon="lock"
        type="password"
        [(model)]="confirm"
      ></app-input>

      <app-button label="Actualizar contrase&ntilde;a" variant="primary" [fullWidth]="true" (clicked)="submit()"></app-button>
    </form>
  </div>
</div>
