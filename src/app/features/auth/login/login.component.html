<div class="page">
  <div class="bg m3"></div>
  <div class="bg m2"></div>
  <div class="bg m1"></div>

  <div class="login">
    <div class="brand">
      <div class="brand-logo" aria-hidden="true">
        <img src="/assets/logo.png" alt="ResiSmart" />
      </div>
      <h1 class="brand-title">ResiSmart</h1>
      <p class="brand-subtitle">Sistema de gesti&oacute;n de condominios</p>
    </div>

    <div class="panel">
      <p class="panel-subtitle">Ingresa tus credenciales para acceder</p>
      <h2 class="panel-title">Iniciar Sesi&oacute;n</h2>

      <form class="form" (submit)="$event.preventDefault()">
        <label class="input-label">Correo electr&oacute;nico</label>
        <app-input
          placeholder="tu@email.com"
          icon="user"
          type="email"
          [(model)]="email"
        ></app-input>

        <label class="input-label">Contrase&ntilde;a</label>
        <app-input
          placeholder="Tu contrase&ntilde;a"
          icon="lock"
          type="password"
          [(model)]="password"
        ></app-input>

        <div class="cta">
          <app-button
            label="Iniciar Sesi&oacute;n"
            variant="sky"
            [fullWidth]="true"
            (clicked)="goHome()"
          ></app-button>
        </div>
      </form>

      <div class="panel-links">
        <a class="link" [routerLink]="'/forgot-password'">&iquest;Olvidaste tu contrase&ntilde;a?</a>
        <a class="link" href="#" (click)="$event.preventDefault()">&iquest;No tienes cuenta? Reg&iacute;strate</a>
      </div>
    </div>
  </div>
</div>
