<div class="page forgot-page">
  <div class="card">
    <h2>Recuperar contrase&ntilde;a</h2>
    <p>Ingresa tu correo y te enviaremos instrucciones si la cuenta existe.</p>

    <form (submit)="$event.preventDefault(); submit()" class="form">
      <label class="input-label">Correo electr&oacute;nico</label>
      <app-input
        placeholder="tu@email.com"
        icon="user"
        type="email"
        [(model)]="email"
      ></app-input>

      <app-button label="Enviar instrucciones" variant="primary" [fullWidth]="true" (clicked)="submit()"></app-button>
    </form>

    <div class="hint" *ngIf="sent">
      Si el correo existe, se enviaron instrucciones para recuperar tu contrase&ntilde;a.
    </div>

    <a class="link" (click)="goLogin()">Volver a iniciar sesi&oacute;n</a>
  </div>
</div>
