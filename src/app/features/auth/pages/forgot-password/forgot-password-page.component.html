<div class="auth-page">
  <div class="card" [class.is-loading]="loading">
    <app-loading-overlay *ngIf="loading" message="Enviando enlace..." tone="inverse"></app-loading-overlay>
    <div class="card__icon" aria-hidden="true">
      <mat-icon fontIcon="lock_reset"></mat-icon>
    </div>
    <h1 class="card__title">Recuperar contrase&ntilde;a</h1>
    <p class="card__subtitle">
      Ingresa tu correo y te enviaremos un enlace para restablecer tu contrase&ntilde;a.
    </p>

    <div *ngIf="infoMessage" class="alert alert--info" role="status" aria-live="polite">
      {{ infoMessage }}
    </div>
    <div *ngIf="errorMessage" class="alert alert--error" role="alert" aria-live="assertive">
      {{ errorMessage }}
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="form" novalidate>
      <label class="field__label" for="email">Correo electr&oacute;nico</label>
      <div class="input-shell" [class.input-shell--invalid]="email.invalid && email.touched">
        <mat-icon fontIcon="mail" class="input-shell__icon"></mat-icon>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="tu@email.com"
          autocomplete="email"
          [attr.aria-invalid]="email.invalid && email.touched"
          [attr.aria-describedby]="email.invalid ? 'email-error' : 'email-help'"
        />
      </div>
      <p class="field__hint" id="email-help">Usa el correo con el que accedes a ResiSmart.</p>
      <p *ngIf="email.hasError('required') && email.touched" id="email-error" class="field__error">
        El correo es obligatorio.
      </p>
      <p *ngIf="email.hasError('email') && email.touched" class="field__error">
        Ingresa un correo v&aacute;lido.
      </p>

      <button class="btn btn--primary" type="submit" [disabled]="loading">
        <ng-container *ngIf="loading; else sendLabel">
          <app-ui-spinner size="sm" tone="inverse"></app-ui-spinner>
          <span>Enviando...</span>
        </ng-container>
        <ng-template #sendLabel>
          <mat-icon fontIcon="send" aria-hidden="true"></mat-icon>
          <span>Enviar enlace</span>
        </ng-template>
      </button>
    </form>

    <a class="card__link" routerLink="/login" aria-label="Volver al inicio de sesi&oacute;n">
      &larr; Volver al inicio de sesi&oacute;n
    </a>
  </div>
</div>
